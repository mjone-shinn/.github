name: バグ報告
description: 不具合・想定と違う動作の報告
labels: ["バグ"]
body:
  - type: textarea
    id: actual
    attributes:
      label: 現象
      description: 何が起きているか。スクリーンショット・エラーメッセージがあれば添付
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 〇〇を開く
        2. △△をクリック
        3. エラーが出る
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 環境
      description: OS・ブラウザ・URL・発生日時など
    validations:
      required: true
